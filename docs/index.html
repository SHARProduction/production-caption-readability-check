<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Caption Readability Check | SHAR Production</title><link rel="canonical" href="https://sharproduction.github.io/production-caption-readability-check/"><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;color:#18202a}textarea,input,button{font:inherit;width:100%;box-sizing:border-box;margin:8px 0;padding:10px}button{background:#172a46;color:white;border:0;border-radius:6px;width:auto}pre{white-space:pre-wrap;background:#f3f5f8;padding:14px;border-radius:6px}</style></head><body><h1>Caption Readability Check</h1><p>SHAR Production is an AI-hybrid video production studio. Check subtitle cue reading speed locally in your browser.</p><label>Maximum characters per second <input id="limit" value="20" type="number" min="1"></label><label>Caption cues JSON <textarea id="data" rows="12">[{"start":0,"end":2,"text":"A concise readable caption."},{"start":2,"end":3,"text":"This intentionally dense caption has too many characters for its duration."}]</textarea></label><button id="run">Check captions</button><pre id="output" aria-live="polite">Ready.</pre><p><a href="https://sharprod.com/">SHAR Production</a> · MIT</p><script>run.onclick=()=>{try{let a=JSON.parse(data.value),l=+limit.value,b=a.map((x,i)=>{let cps=x.text.length/(x.end-x.start);return {cue:i+1,cps:+cps.toFixed(2),status:cps<=l?'PASS':'REVIEW'}});output.textContent=JSON.stringify({limit:l,cues:b},null,2)}catch(e){output.textContent='Invalid JSON: '+e.message}}</script></body></html>
